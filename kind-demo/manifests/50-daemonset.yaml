# One pod per node, including the control plane.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: kubelite-demo
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "/scripts/loggen.sh"]
          env:
            - { name: SERVICE, value: node-agent }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: scripts
          configMap:
            name: demo-scripts
