# Healthy, 3 replicas, 2 containers per pod (tests the container picker and multi-pod logs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubelite-demo
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: web-config
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
        - name: app-logs
          image: busybox:1.37
          command: ["sh", "/scripts/loggen.sh"]
          env:
            - { name: SERVICE, value: web }
            - { name: BURST, value: "2" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: scripts
          configMap:
            name: demo-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kubelite-demo
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# No ingress controller in kind by default; this exists so the Ingresses view has data.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: kubelite-demo
spec:
  rules:
    - host: web.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
# Tests that manual scaling is disabled when an HPA owns the replica count.
# Metrics show <unknown> without metrics-server; that is expected.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: kubelite-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
